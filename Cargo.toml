[workspace]
members = [
    "crates/kvaser-api",
    "crates/kvaser-core",
    "crates/kvaser-tui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/raceup/kvaser_utils"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "=1.0.102"
bindgen = "=0.72.1"
clap = { version = "=4.6.1", features = ["derive"] }
crossterm = "=0.28.1"
libloading = "=0.8.9"
libc = "=0.2.185"
ratatui = "=0.29.0"
serde = { version = "=1.0.228", features = ["derive"] }
toml = "=0.8.23"
thiserror = "=2.0.18"
